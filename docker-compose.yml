version: '3.8'

services:
  # MariaDB - Base de datos
  mariadb:
    image: mariadb:latest
    container_name: wordpress_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=wordpress
      - MYSQL_ROOT_PASSWORD=tu_contraseña_root_fuerte
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=tu_contraseña_wordpress_fuerte
      - TZ=Europe/Madrid
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # WordPress - CMS
  wordpress:
    image: wordpress:php8.2-fpm
    container_name: wordpress_app
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      - WORDPRESS_DB_HOST=mariadb:3306
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=tu_contraseña_wordpress_fuerte
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_TABLE_PREFIX=wp_
      - WORDPRESS_DEBUG=false
    volumes:
      - wordpress_data:/var/www/html

  # Nginx - Reverse Proxy / Web Server
  nginx:
    image: nginx:alpine
    container_name: wordpress_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - wordpress_data:/var/www/html:ro
    depends_on:
      - wordpress

  # phpMyAdmin - Gestión BD web UI
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wordpress_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=mariadb
      - PMA_USER=root
      - PMA_PASSWORD=tu_contraseña_root_fuerte
    ports:
      - "8080:80"

volumes:
  wordpress_data:
  db_data: